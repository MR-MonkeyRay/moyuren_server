server:
  host: "0.0.0.0"
  port: 8000
  base_domain: "http://127.0.0.1:8000"

timezone:
  business: "Asia/Shanghai"
  display: "local"

paths:
  cache_dir: "cache"

scheduler:
  mode: "hourly"
  daily_times:
  - "06:00"
  minute_of_hour: 0

cache:
  retain_days: 30
  max_images_per_template_per_day: 3  # 每个模板每天最多保留的图片数

ops:
  api_key: ""

# Prometheus 指标始终记录；仅在启用后注册 /metrics 端点
# metrics:
#   enabled: false  # 环境变量：MOYUREN_METRICS_ENABLED

network:
  proxy_url: null  # Optional: "http://proxy.example:8080" or "socks5://proxy.example:1080"
  ghproxy_urls:
    - "https://ghfast.top/"

# 60s 公共实例（news / fun_content / crazy_thursday / gold_price 共享）
# 60s 主域名对数据中心/海外出口 IP 会返回 Cloudflare 403，主源不可用时自动切换到这些等价实例
instances:
  # 官方实例列表文档（Markdown），自动解析并带 6 小时缓存；null 表示关闭自动发现
  list_url: "https://docs.60s-api.viki.moe/7306811m0.md"
  # 额外/兜底的实例基地址（可选，优先于自动发现结果；端点路径沿用各数据源的 url）
  urls: []
  # 仅过滤自动发现的实例；null 不过滤，[] 全部拒绝；*.example.com 仅匹配子域名
  allowlist: null

templates:
  default: "moyuren"
  dir: "templates"
  config:
    device_scale_factor: 3
    jpeg_quality: 100
    use_china_cdn: true
    local_fonts_dir: "templates/fonts"  # 本地 WOFF2 字体及 fonts.css 目录；相对路径基于进程工作目录（通常为项目根目录）
    remote_font_fallback: true  # 本地子集缺字时加载 Google Fonts；离线部署可设为 false
    remote_resource_cache_enabled: true
    remote_resource_cache_ttl_sec: 604800
    remote_resource_timeout_sec: 5.0
    page_load_timeout_sec: 10.0
    font_ready_timeout_sec: 2.0
    remote_resource_max_size_kb: 5120
    remote_resource_max_redirects: 5  # 每次资源请求最多重定向 5 次，每跳检查白名单；0 禁止重定向
    # 只允许这些主机及其子域名的 HTTP(S) 资源；[] 禁用远程资源，data:/blob: 仍可用
    allowed_resource_hosts:
      - "fonts.googleapis.com"
      - "fonts.googleapis.cn"
      - "fonts.gstatic.com"
      - "fonts.gstatic.cn"
    # 外部文本上限（正整数；字符数包含截断后的省略号），渲染与存储数据共用
    text_limits:
      news_item: 120
      news_items: 15  # 新闻条数上限
      fun_content: 300
      kfc_text: 300
      daily_english_definition: 200
      daily_english_translation: 200
      holiday_name: 20

data_sources:
  - type: "news"
    url: "https://60s.viki.moe/v2/60s"
    timeout_sec: 10
    params:
      "force-update": "false"
    # 主接口不可用时依次回退：全局 instances 公共实例 → 60s 静态镜像
    # （cdn.jsdmirror.com / 60s-static.viki.moe / GitHub raw，并复用 network.ghproxy_urls）

  - type: "fun_content"
    timeout_sec: 5
    endpoints:
      - name: "dad_joke"
        url: "https://60s.viki.moe/v2/dad-joke"
        data_path: "data.content"
        display_title: "🤣 冷笑话"
      - name: "hitokoto"
        url: "https://60s.viki.moe/v2/hitokoto"
        data_path: "data.hitokoto"
        display_title: "💬 一言"
      - name: "duanzi"
        url: "https://60s.viki.moe/v2/duanzi"
        data_path: "data.duanzi"
        display_title: "😂 搞笑段子"
      - name: "moyu_quote"
        url: "https://60s.viki.moe/v2/moyu"
        data_path: "data.moyuQuote"
        display_title: "🐟 摸鱼语录"

  - type: "crazy_thursday"
    enabled: true
    url: "https://60s.viki.moe/v2/kfc"
    timeout_sec: 5

  - type: "holiday"
    timeout_sec: 10

  - type: "stock_index"
    quote_url: "https://push2delay.eastmoney.com/api/qt/ulist.np/get"
    timeout_sec: 5
    secids:
      - {secid: "1.000001", name: "上证指数", market: "A"}
      - {secid: "0.399001", name: "深证成指", market: "A"}
      - {secid: "0.399006", name: "创业板指", market: "A"}
      - {secid: "100.HSI", name: "恒生指数", market: "HK"}
      - {secid: "100.DJIA", name: "道琼斯", market: "US"}
    market_timezones:
      A: "Asia/Shanghai"
      HK: "Asia/Hong_Kong"
      US: "America/New_York"
    cache_ttl_sec: 60

  - type: "gold_price"
    url: "https://60s.viki.moe/v2/gold-price"
    timeout_sec: 5

  - type: "daily_english"
    enabled: true
    word_api_url: "https://random-word-api.herokuapp.com/word"
    max_retries: 10
    difficulty_range: [3, 5]
    backend:
      type: "sqlite"
      db_path: "ecdict/stardict.db"
      download_url: "https://github.com/skywind3000/ECDICT/releases/download/1.0.28/ecdict-sqlite-28.zip"

logging:
  level: "INFO"
  file: "logs/app.log"
